name: RoadRebels
options:
  bundleIdPrefix: com.roadrebels
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  RoadRebels:
    type: application
    platform: iOS
    sources:
      - path: RoadRebels
    info:
      path: RoadRebels/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: "Road Rebels"
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadrebels.game
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies: []

  RoadRebelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoadRebelsTests
    dependencies:
      - target: RoadRebels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  RoadRebelsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RoadRebelsUITests
    dependencies:
      - target: RoadRebels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoadRebels:
    build:
      targets:
        RoadRebels: all
        RoadRebelsTests: [test]
        RoadRebelsUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: RoadRebels.storekit
    test:
      config: Debug
      targets:
        - RoadRebelsTests
        - RoadRebelsUITests
